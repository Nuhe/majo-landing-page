limit_req_zone $binary_remote_addr zone=booking:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/reuniones {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        limit_req zone=booking burst=5 nodelay;
        limit_req_status 429;

        # Resolve n8n when a request arrives so the site can start before n8n joins the network.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $booking_backend n8n;
        proxy_pass http://$booking_backend:5678/webhook/plan-paracaidas/reunion;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
